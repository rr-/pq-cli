[project]
name = "pqcli"
version = "1.1.0"
description = "Progress Quest: the CLI edition"
authors = [{ name = "Laura Kurczewska", email = "dash@wind.garden" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "xdg-base-dirs>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
windows = ["windows-curses>=2.3.0,<3.0.0"]

[project.urls]
Repository = "https://github.com/rr-/pq-cli.git"

[project.scripts]
pqcli = "pqcli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["prek>=0.2", "pytest>=8.0", "ty>=0.0.89"]

[tool.ty.src]
# Only the package and its tests; agent worktrees under .claude/ would
# otherwise be checked as duplicate copies of the project.
include = ["pqcli", "tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pqcli"]
