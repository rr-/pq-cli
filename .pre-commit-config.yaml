default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: ty
    name: ty
    entry: uv run ty check
    language: system
    pass_filenames: false
    types: [python]
  - id: commit-msg-50-72
    name: Commit message 50/72 rule
    entry: python3 .prek/check_commit_msg
    language: system
    stages: [commit-msg]
